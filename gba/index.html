<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GAME BOY ADVANCE 网页模拟器</title>
<meta name="description" content="纯前端 Game Boy Advance 网页模拟器：3D 机身可旋转、插卡动画、手机端虚拟按键。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='7' width='30' height='18' rx='6' fill='%235b4d8e'/%3E%3Crect x='9' y='10' width='14' height='12' rx='1.5' fill='%239fc0ea'/%3E%3Ccircle cx='26' cy='19' r='2.2' fill='%23d34b6a'/%3E%3Ccircle cx='22' cy='22' r='2.2' fill='%23d34b6a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=1795666799">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="topbar">
    <div class="brand">
      <a class="back-home" href="../index.html" title="返回展厅" aria-label="返回展厅">←</a>
      <span class="brand-mark">▣</span>
      <div>
        <h1>GAME BOY ADVANCE <em>网页模拟器</em></h1>
        <p>上传卡带 ROM · 3D 机身可旋转 · 插卡效果</p>
      </div>
    </div>
    <div class="chips">
      <span class="chip beta" title="内核仍在打磨：目前仅合成测试 ROM 可完整运行">内测版</span>
      <span id="statusChip" class="chip">待机中</span>
      <span id="fpsChip" class="chip dim">-- FPS</span>
    </div>
  </header>

  <aside id="infoCard" class="info-card">
    <div class="info-head">
      <div class="cart-icon">🎮</div>
      <div>
        <div id="cartTitle" class="cart-title">—</div>
        <div id="cartFile" class="cart-file">未插入卡带</div>
      </div>
      <span class="ic-caret" aria-hidden="true"></span>
    </div>
    <div id="cartRows" class="cart-rows"></div>
  </aside>

  <section class="controls">
    <input type="file" id="fileInput" accept=".gba,.bin,.rom,.zip" hidden>
    <button id="btnUpload" class="btn primary" title="上传 ROM">📤<span class="bt"> 上传 ROM</span></button>
    <button id="btnDemo" class="btn" title="载入自检卡带（内核链路自测）">⭐<span class="bt"> 自检卡带</span></button>
    <button id="btnEject" class="btn" title="弹出卡带">⏏<span class="bt"> 弹出卡带</span></button>
    <button id="btnPause" class="btn" title="暂停">⏸<span class="bt"> 暂停</span></button>
    <button id="btnReset" class="btn" title="重启">↻<span class="bt"> 重启</span></button>
    <button id="btnFull" class="btn" title="全屏">⛶<span class="bt"> 全屏</span></button>
    <button id="btnMute" class="btn icon" title="声音开关" aria-label="声音开关">
      <svg class="ic-vol" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6.2 9H3v6h3.2L11 19z" fill="currentColor" stroke="none"/>
        <path class="vw vw1" d="M14.8 9.2a4.2 4.2 0 0 1 0 5.6"/>
        <path class="vw vw2" d="M17.6 6.4a8.4 8.4 0 0 1 0 11.2"/>
        <line class="vx" x1="15.5" y1="9.5" x2="20.5" y2="14.5"/>
        <line class="vx" x1="20.5" y1="9.5" x2="15.5" y2="14.5"/>
      </svg>
    </button>
    <span class="sep"></span>
    <label class="field sel">
      <span>外壳</span>
      <select id="shellSel">
        <option value="indigo">靛紫（原色）</option>
        <option value="glacier">冰川蓝</option>
        <option value="black">午夜黑</option>
        <option value="white">雪白</option>
        <option value="orange">珊瑚橙</option>
      </select>
    </label>
    <label class="field">
      <span>音量</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
    </label>
    <p class="beta-note">内测：BIOS HLE（SWI）未实现，商业 ROM 会停在黑屏；点「自检卡带」可验证内核 → 3D 屏幕链路</p>
  </section>

  <p class="hint">键盘：方向键 十字键 · X / Z = A / B · A / S = L / R · 回车 = START · Shift = SELECT · 空格 = 暂停 · 也可以直接点击 3D 机身按键 · 拖拽 ROM 到页面即可插卡</p>

  <div id="fsGameView" hidden><button id="fsExit" class="fs-exit" aria-label="退出全屏" title="退出全屏">✕</button><span class="fs-tip">Esc 退出全屏</span></div>


  <div class="touch" aria-hidden="true">
    <div class="ss">
      <button id="tSelect" class="tbtn pill">SELECT</button>
      <button id="tStart" class="tbtn pill">START</button>
    </div>
    <div class="touch-row">
      <div class="dpad">
        <button id="tUp" class="tbtn">▲</button>
        <button id="tLeft" class="tbtn">◀</button>
        <button id="tRight" class="tbtn">▶</button>
        <button id="tDown" class="tbtn">▼</button>
      </div>
      <div class="ab">
        <button id="tL" class="tbtn round sm">L</button>
        <button id="tB" class="tbtn round">B</button>
        <button id="tA" class="tbtn round">A</button>
        <button id="tR" class="tbtn round sm">R</button>
      </div>
    </div>
  </div>

  <div id="dropOverlay" class="drop-overlay">
    <div class="drop-box">
      <div class="cart-big">🎮</div>
      <p>松开手指，插入卡带</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="errBox" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:999;max-width:78%;padding:18px 22px;border-radius:14px;background:#fff;border:1px solid #e2e5ea;box-shadow:0 10px 40px rgba(0,0,0,.16);font-size:13px;color:#1c1f26">
    <b style="font-size:14px">页面加载出错了</b>
    <pre id="errMsg" style="white-space:pre-wrap;margin:10px 0 0;font-size:12px;color:#a02b2b;font-family:ui-monospace,Menlo,monospace"></pre>
  </div>
  <script>
  (function () {
    function show(m) {
      var b = document.getElementById('errBox');
      if (!b) return;
      document.getElementById('errMsg').textContent = String(m);
      b.style.display = 'block';
    }
    window.__showErr = show;
    window.addEventListener('error', function (e) {
      show((e.message || '未知错误') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      show('Promise: ' + (r && r.stack ? r.stack : r));
    });
  })();
  </script>

  <script type="module" src="src/main.js?v=1795666799"></script>
</body>
</html>
